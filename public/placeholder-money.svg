<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- Person body -->
  <ellipse cx="80" cy="105" rx="35" ry="30" fill="#FF85A0"/>
  <!-- Head -->
  <circle cx="80" cy="65" r="22" fill="#FFB347"/>
  <!-- Hair -->
  <ellipse cx="80" cy="48" rx="22" ry="10" fill="#2D1B10"/>
  <!-- Money bills floating -->
  <rect x="100" y="30" width="30" height="20" rx="4" fill="#5DBB63" transform="rotate(20 100 30)"/>
  <rect x="50" y="20" width="30" height="20" rx="4" fill="#5DBB63" transform="rotate(-15 50 20)"/>
  <rect x="115" y="55" width="25" height="18" rx="4" fill="#5DBB63" transform="rotate(30 115 55)"/>
  <!-- Dollar signs on bills -->
  <text x="108" y="44" font-size="10" fill="#2D6A2D" transform="rotate(20 108 44)">$</text>
  <text x="58" y="33" font-size="10" fill="#2D6A2D" transform="rotate(-15 58 33)">$</text>
  <text x="121" y="68" font-size="9" fill="#2D6A2D" transform="rotate(30 121 68)">$</text>
  <!-- Chain/necklace -->
  <ellipse cx="80" cy="95" rx="20" ry="8" fill="#FFD700" opacity="0.8"/>
</svg>
