  <rect x="55" y="28" width="50" height="84" rx="6" fill="#FFF0F5"/>
  <!-- Screen content: leaderboard items -->
  <rect x="58" y="32" width="44" height="12" rx="3" fill="#FF85A0"/>
  <rect x="58" y="48" width="44" height="10" rx="3" fill="#FFB6C1"/>
  <rect x="58" y="62" width="44" height="10" rx="3" fill="#FFD6E0"/>
