<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- Tripod legs -->
  <line x1="80" y1="130" x2="50" y2="155" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="130" x2="110" y2="155" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="130" x2="80" y2="155" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <!-- Pole -->
